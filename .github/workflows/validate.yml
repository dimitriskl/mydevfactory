name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and references
        run: python3 scripts/validate_skill.py
      - name: Run workflow and validator regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify the completed invoice example
        run: >-
          python3 skills/mydevfactory/scripts/check_workflow.py --config .mydevfactory.json
          --route full --card examples/prd/invoice-approval/prd-tasks/001-approve-invoice.md
          --revision e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1
  installer-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer end-to-end tests
        run: bash tests/installer_e2e.sh
  installer-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer end-to-end tests
        shell: pwsh
        run: ./tests/installer_e2e.ps1
